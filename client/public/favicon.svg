<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="none" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  <!-- Main N-shape made of connecting network paths -->
  <path d="M12 38V10L36 38V10" stroke="url(#grad1)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Node circles representing network -->
  <circle cx="12" cy="10" r="5" fill="#4f46e5" stroke="#ffffff" stroke-width="2" />
  <circle cx="12" cy="38" r="5" fill="#06b6d4" stroke="#ffffff" stroke-width="2" />
  <circle cx="36" cy="10" r="5" fill="#4f46e5" stroke="#ffffff" stroke-width="2" />
  <circle cx="36" cy="38" r="5" fill="#06b6d4" stroke="#ffffff" stroke-width="2" />
  <!-- A central connection node to signify community -->
  <circle cx="24" cy="24" r="3.5" fill="#ffffff" />
  <line x1="12" y1="38" x2="24" y2="24" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="2 2" />
  <line x1="36" y1="10" x2="24" y2="24" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="2 2" />
</svg>